[manifest]
version = '1.0.0'
dump_lua = true
priority = 0



#draw soul with edition 
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/card_draw.lua"]'''
match_indent = true
pattern = '''if edition.apply_to_float and self.children.floating_sprite then'''
position = 'at'
payload = '''local apply_edition = edition.apply_to_float
if (self.config.center.rd_soul_draw_edition ~= nil) then
    	apply_edition = self.config.center.rd_soul_draw_edition
end
if apply_edition and self.children.floating_sprite then'''



#canvas drawing should disable basic drawing
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/card_draw.lua"]'''
match_indent = true
pattern = '''function Card:draw(layer)'''
position = 'after'
payload = '''RainyDays.disable_normal_drawing = self.config.center.rd_canvas_drawing
or (RainyDays.config.metallic_hightlights and self.config.center.rd_highlight_shader)
or ((RainyDays.config.clarifiers == 1 or RainyDays.config.clarifiers == 2) and self.config.center.rd_indicator_shader)
if RainyDays.disable_normal_drawing and self.config.center_key == 'j_satellite' and not RainyDays.config.satellite then
  RainyDays.disable_normal_drawing = false
end'''

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/card_draw.lua"]'''
match_indent = true
pattern = '''SMODS.DrawStep {
    key = 'center',
    order = -10,
    func = function(self, layer)'''
position = 'after'
payload = '''        if RainyDays.disable_normal_drawing and (self.config.center.discovered or self.bypass_discovery_center) then return end'''

